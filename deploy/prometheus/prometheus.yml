global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pulsequeue-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: pulsequeue-scheduler
    static_configs:
      - targets: ["scheduler:8001"]
    metrics_path: /metrics
