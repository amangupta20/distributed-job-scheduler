version: '3.3'

networks:
  public:
  backend:
    internal: true

volumes:
  pgdata:

services:

  # ── Database ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── One-shot migration ────────────────────────────────────────────────────────
  migrate:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
    networks:
      - backend
    restart: "no"

  # ── FastAPI Control Plane ─────────────────────────────────────────────────────
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    command: ["uvicorn", "scheduler_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS}
      WORKER_DRAIN_SECONDS: ${WORKER_DRAIN_SECONDS}
      PRIORITY_AGING_SECONDS: ${PRIORITY_AGING_SECONDS}
      PRIORITY_AGING_MAX_BOOST: ${PRIORITY_AGING_MAX_BOOST}
    ports:
      - "${API_PORT}:8000"
    networks:
      - public
      - backend
    depends_on:
      - migrate
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ── Scheduler Tick Process ────────────────────────────────────────────────────
  scheduler:
    build:
      context: ..
      dockerfile: services/scheduler/Dockerfile
    command: ["uvicorn", "scheduler_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS}
      WORKER_DRAIN_SECONDS: ${WORKER_DRAIN_SECONDS}
      PRIORITY_AGING_SECONDS: ${PRIORITY_AGING_SECONDS}
      PRIORITY_AGING_MAX_BOOST: ${PRIORITY_AGING_MAX_BOOST}
    networks:
      - backend
    depends_on:
      - migrate
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ── Go Worker (scalable: docker-compose up --scale worker=3) ─────────────────
  worker:
    build:
      context: ../services/worker
      dockerfile: Dockerfile
    environment:
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL}
      WORKER_NAME: pulsequeue-worker
      WORKER_VERSION: "0.1.0"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS}
      WORKER_DRAIN_SECONDS: ${WORKER_DRAIN_SECONDS}
    networks:
      - backend
    depends_on:
      - migrate
      - postgres
    restart: unless-stopped
    stop_grace_period: 30s

  # ── Prometheus (optional — start with: docker-compose --profile observability up) ─
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - backend
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped

  # ── Grafana (optional) ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - backend
    depends_on:
      - prometheus
    restart: unless-stopped
